<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявка — ShopProject</title>
  <meta name="description" content="Форма оформления заявки на учебный товар.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">ShopProject</a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav-list"
        aria-label="Открыть меню">
        <span class="nav-toggle__line" aria-hidden="true"></span>
        <span class="nav-toggle__line" aria-hidden="true"></span>
        <span class="nav-toggle__line" aria-hidden="true"></span>
      </button>

      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list" id="site-nav-list">
          <li class="site-nav__item">
            <a class="site-nav__link" href="index.html">Главная</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="catalog.html">Каталог</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="product.html">Товар</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link site-nav__link--active" href="order.html">Заявка</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="contacts.html">Контакты</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="top">
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <span class="breadcrumbs__current">Заявка</span>
    </nav>

    <section class="section">
      <h1>Оформление заявки</h1>

      <form class="order-form" action="#" method="post">
        <p class="order-form__note order-form__field--wide">
          Поля, отмеченные звёздочкой (*), обязательны для заполнения.
        </p>

        <div class="order-form__field">
          <label class="order-form__label" for="order-name">Имя *</label>
          <input class="order-form__input" id="order-name" name="name" type="text" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-email">E-mail *</label>
          <input class="order-form__input" id="order-email" name="email" type="email" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-phone">Телефон</label>
          <input class="order-form__input" id="order-phone" name="phone" type="tel" placeholder="+7 900 000-00-00">
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-product">Товар *</label>
          <select class="order-form__select" id="order-product" name="product" required>
            <option value="">Выберите товар</option>
            <option value="product-1">Товар 1</option>
            <option value="product-2">Товар 2</option>
            <option value="product-3">Товар 3</option>
          </select>
        </div>

        <div class="order-form__field order-form__field--wide">
          <label class="order-form__label" for="order-comment">Комментарий</label>
          <textarea class="order-form__textarea" id="order-comment" name="comment"></textarea>
        </div>

        <div class="order-form__check order-form__field--wide">
          <input class="order-form__checkbox" id="order-agree" name="agree" type="checkbox" required>
          <label for="order-agree">Я согласен на обработку персональных данных *</label>
        </div>

        <div class="order-form__actions order-form__field--wide">
          <button class="button button--primary" type="submit">Отправить заявку</button>
          <button class="button button--secondary" type="reset">Очистить</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer" id="contacts">
    <div class="site-footer__inner">
      <p class="site-footer__text">&copy; 2026 ShopProject. Учебный проект.</p>
      <nav class="site-footer__links" aria-label="Ссылки в подвале">
        <a href="index.html#advantages">Преимущества</a>
        <a href="index.html#popular">Популярные товары</a>
        <a href="contacts.html">Контакты</a>
      </nav>
    </div>
  </footer>

  <a class="button button--primary back-to-top" href="#top">Наверх</a>
</body>
</html>
